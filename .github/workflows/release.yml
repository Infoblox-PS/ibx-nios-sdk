# NIOS Python SDK release workflow.
name: Release

# Creates (or updates) a GitHub Release when a tag matching "v*" is
# pushed. Builds the Python distribution (wheel + sdist), attaches it to the
# release, then publishes it to PyPI.
#
# Security note: every dynamic value used in shell scripts is passed via
# `env:` with quoted variable expansion. We never interpolate
# ${{ ... }} directly into a `run:` script.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build distribution and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the tag's annotation for the release notes.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          pip install build

      # A tag whose version disagrees with pyproject.toml would publish the
      # wrong version to PyPI, or collide with one already there. Fail here
      # rather than half way through the release.
      - name: Check the tag matches the packaged version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          packaged=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [[ "$REF_NAME" != "v$packaged" ]]; then
            echo "::error::tag $REF_NAME does not match pyproject version $packaged (expected v$packaged)"
            exit 1
          fi
          if ! grep -q "^## \[$packaged\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$packaged]' section"
            exit 1
          fi
          echo "tag $REF_NAME matches version $packaged, and the changelog has an entry"

      - name: Build Python distribution (wheel + sdist)
        run: python -m build

      # Extract the tag's annotation message as the release notes. Write
      # to a file rather than interpolating into the shell so multi-line
      # content and special characters are handled safely.
      - name: Extract release notes from tag annotation
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git tag -l --format='%(contents)' "$REF_NAME" > release-notes.md
          if [[ ! -s release-notes.md ]]; then
            echo "Release $REF_NAME" > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create or update GitHub Release with the distribution
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$REF_NAME" >/dev/null 2>&1; then
            echo "Release $REF_NAME already exists - uploading/replacing assets."
            gh release upload "$REF_NAME" --clobber dist/*.whl dist/*.tar.gz
          else
            echo "Creating release $REF_NAME."
            gh release create "$REF_NAME" \
              --title "$REF_NAME" \
              --notes-file release-notes.md \
              dist/*.whl dist/*.tar.gz
          fi

      - name: Store distribution as workflow artifact (audit trail)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: dist/

  # Publishing is a separate job so a PyPI failure cannot leave the GitHub
  # release half-made, and so the upload runs with only the permissions it
  # needs. The `pypi` environment gates the upload.
  #
  # Authentication takes whichever of the two is configured:
  #   - PyPI Trusted Publishing (OIDC), used when no PYPI_API_TOKEN secret
  #     exists. Nothing is stored in the repository. Configure it at
  #     https://pypi.org/manage/account/publishing/ with owner Infoblox-PS,
  #     repository ibx-nios-sdk, workflow release.yml, environment pypi.
  #   - An API token in the PYPI_API_TOKEN secret, which takes precedence when
  #     set (`gh secret set PYPI_API_TOKEN`).
  publish-pypi:
    name: Publish to PyPI
    needs: build-and-release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ibx-nios-sdk
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-artifacts-${{ github.ref_name }}
          path: artifacts

      # upload-artifact flattens a single directory path, so the files can
      # arrive at artifacts/ or artifacts/dist/ depending on what was packed.
      - name: Collect the distribution
        run: |
          set -euo pipefail
          mkdir -p dist
          find artifacts -type f \( -name '*.whl' -o -name '*.tar.gz' \) \
            -exec mv {} dist/ \;
          ls -l dist
          test -n "$(ls -A dist)"

      # An empty password falls through to Trusted Publishing.
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
