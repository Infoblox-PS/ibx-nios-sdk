  { "Common Patterns" = "common-patterns.md" },
  { "API Reference" = [
    { "Overview" = "reference/index.md" },
    { "DNS" = "reference/dns.md" },
    { "IPAM" = "reference/ipam.md" },
    { "DHCP" = "reference/dhcp.md" },
    { "Grid" = "reference/grid.md" },
