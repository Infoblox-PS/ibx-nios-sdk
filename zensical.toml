# ============================================================================
# Theme Configuration
# ============================================================================

[project.theme]

language = "en"
logo = "assets/Infoblox_Logo_Primary_Reverse_RGB.png"
favicon = "assets/infoblox-favicon-green.svg"

features = [
  "content.code.copy",
  "content.code.annotate",
  "content.tabs.link",
  "content.tooltips",
  "navigation.footer",
  "navigation.sections",
  "navigation.expand",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

# ============================================================================
# Color Scheme
# ============================================================================

[[project.theme.palette]]
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

# ============================================================================
# Repository
# ============================================================================

[project.repo]
url = "https://github.com/Infoblox-PS/ibx-nios-sdk"
name = "Infoblox-PS/ibx-nios-sdk"

# ============================================================================
# Social Links
# ============================================================================

[project.extra]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/Infoblox-PS/ibx-nios-sdk"

# ============================================================================
# Markdown Extensions
# ============================================================================

[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.details]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

# ============================================================================
# Plugins - mkdocstrings auto-API-reference
# ============================================================================
# Zensical has built-in mkdocstrings support (zensical.compat.mkdocstrings).
# Enabling the plugin lets us drop ::: ibx_nios_sdk.dns._record_a.RecordAResource
# into a markdown page and zensical renders the full class signature, all
# methods, params, and docstrings inline.

[project.plugins.mkdocstrings]
default_handler = "python"

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
show_root_heading       = true
show_root_full_path     = false
show_source             = true
show_signature          = true
show_signature_annotations = true
separate_signature      = true
docstring_style         = "google"
docstring_section_style = "table"
merge_init_into_class   = true
members_order           = "source"
filters                 = ["!^_"]
inherited_members       = true
